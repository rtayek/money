<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simplifi Transaction Probe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Simplifi probe</h1>
  <p>Keep this window open while working in Simplifi. Only Apply saves notes.</p>
  <div class="actions">
    <button id="scan">Scan visible page</button>
    <button id="inspectEditor">Inspect open transaction</button>
    <button id="copy" disabled>Copy report</button>
  </div>
  <p id="status" role="status">Ready.</p>
  <hr>
  <h2>Match annotated CSV</h2>
  <p>Use the same payee filter here and in Simplifi, or leave both unfiltered.</p>
  <label for="csv">Annotated CSV</label>
  <input id="csv" type="file" accept=".csv,text/csv">
  <label for="payeeFilter">Payee contains</label>
  <input id="payeeFilter" type="text" value="Google">
  <div class="actions">
    <button id="match" disabled>Match visible rows</button>
    <button id="sweep" disabled>Sweep filtered rows</button>
    <button id="prepareNote" disabled>Prepare open note (not saved)</button>
    <button id="applyFive" disabled>Apply up to 5 visible notes</button>
    <button id="clear">Clear marks</button>
  </div>
  <p id="matchStatus" role="status">Choose all-annotated.csv.</p>
  <details>
    <summary>Match details</summary>
    <pre id="matchReport" aria-label="CSV match report"></pre>
  </details>
  <details>
    <summary>Inspection details</summary>
    <pre id="report" aria-label="Sanitized probe report"></pre>
  </details>
  <script src="matcher-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
